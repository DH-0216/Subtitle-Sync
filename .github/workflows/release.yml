name: Build & Release Multiplatform

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            name: Windows
          - os: macos-latest
            platform: mac
            name: macOS
          - os: ubuntu-22.04
            platform: linux
            name: Linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Setup FFmpeg via official GitHub CDN action (never fails with 503)
      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Linux OS build dependencies
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libsecret-1-dev

      # Bundle FFmpeg into bin/
      - name: Copy FFmpeg into bin/ (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin
          $ff = (Get-Command ffmpeg).Source
          Copy-Item $ff -Destination "bin/ffmpeg.exe" -Force
          Write-Host "[SUCCESS] FFmpeg placed in bin/ffmpeg.exe"

      - name: Copy FFmpeg into bin/ (macOS & Linux)
        if: runner.os != 'Windows'
        run: |
          mkdir -p bin
          cp $(which ffmpeg) bin/ffmpeg
          chmod +x bin/ffmpeg
          echo "[SUCCESS] FFmpeg placed in bin/ffmpeg"

      # Compile standalone FFSubSync binary using custom hook script
      - name: Compile Standalone FFSubSync
        run: |
          python -m pip install --upgrade pip
          python -m pip install ffsubsync pyinstaller auditok webrtcvad-wheels
          python scripts/build_ffsubsync.py

      - name: Verify Engine Binaries
        shell: bash
        run: |
          ls -la bin/

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Package Desktop Application
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --${{ matrix.platform }}

      - name: Clean up temporary dist files
        shell: bash
        run: |
          rm -f dist/builder-debug.yml dist/builder-effective-config.yaml dist/*.blockmap

      # Save artifacts in the Actions tab for review/testing
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleSync-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: warn

      # Automatically attach files to GitHub Release
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
