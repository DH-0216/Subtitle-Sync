name: Build & Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.2.0). If provided, assets will be attached to this release.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache engine binaries
        id: cache-binaries
        uses: actions/cache@v4
        with:
          path: bin
          key: engine-binaries-${{ runner.os }}-v1

      - name: Prepare engine binaries
        shell: pwsh
        run: ./scripts/prepare-binaries.ps1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node dependencies
        run: npm ci

      - name: Build application bundles
        run: npm run build

      - name: Package desktop executables
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          Get-FileHash dist/SubtitleSync-Setup.exe, dist/SubtitleSync-Portable.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name || inputs.tag }}
          name: ${{ github.event.release.name || github.ref_name || inputs.tag }}
          files: |
            dist/SubtitleSync-Setup.exe
            dist/SubtitleSync-Portable.exe
            dist/latest.yml
            dist/SubtitleSync-Setup.exe.blockmap
            dist/SHA256SUMS.txt
          generate_release_notes: ${{ github.event_name != 'release' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts (CI Run)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SubtitleSync-Windows-Build
          path: |
            dist/SubtitleSync-Setup.exe
            dist/SubtitleSync-Portable.exe
            dist/latest.yml
            dist/SubtitleSync-Setup.exe.blockmap
            dist/SHA256SUMS.txt
          if-no-files-found: warn
