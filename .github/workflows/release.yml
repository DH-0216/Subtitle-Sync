name: Build & Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.2.0). If provided, assets will be attached to this release.'
        required: false
        type: string
      title:
        description: 'Release title subtitle (e.g. Portable In-Place Auto-Updater)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache engine binaries
        id: cache-binaries
        uses: actions/cache@v4
        with:
          path: bin
          key: engine-binaries-${{ runner.os }}-v1

      - name: Prepare engine binaries
        shell: pwsh
        run: ./scripts/prepare-binaries.ps1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node dependencies
        run: npm ci

      - name: Build application bundles
        run: npm run build

      - name: Package desktop executables
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          Get-FileHash dist/SubtitleSync-Setup.exe, dist/SubtitleSync-Portable.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Resolve Release Title & Metadata
        id: release-meta
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name || github.ref_name || inputs.tag }}"
          $customTitle = ""

          # 1. Manual trigger input
          if ("${{ inputs.title }}") {
            $customTitle = "${{ inputs.title }}".Trim()
          }

          # 2. Check annotated git tag message (only if annotated tag, not lightweight commit)
          if (-not $customTitle -and $tag) {
            $tagType = (git cat-file -t $tag 2>$null)
            if ($tagType -eq "tag") {
              $tagMsg = (git tag -l --format='%(contents:subject)' $tag).Trim()
              if ($tagMsg -and $tagMsg -ne $tag -and $tagMsg -notmatch '^Merge ') {
                $customTitle = $tagMsg
              }
            }
          }

          # 3. Fallback: Parse meaningful commits (feat: or fix:) since previous tag
          if (-not $customTitle) {
            try {
              $prevTag = (git describe --tags --abbrev=0 "$tag^" 2>$null)
              $range = if ($prevTag) { "$prevTag..$tag" } else { "$tag" }
              $commits = @(git log $range --format='%s')

              $featCommits = @($commits | Where-Object { $_ -match '^(feat|feature)(\(.*\))?:\s*(.+)$' })
              $fixCommits  = @($commits | Where-Object { $_ -match '^(fix|bug)(\(.*\))?:\s*(.+)$' })

              if ($featCommits.Count -gt 0) {
                $cleaned = @($featCommits | ForEach-Object {
                  if ($_ -match '^(?:feat|feature)(?:\(.*\))?:\s*(.+)$') {
                    $t = $matches[1].Trim()
                    if ($t.Length -gt 1) { $t.Substring(0,1).ToUpper() + $t.Substring(1) } else { $t }
                  }
                })
                if ($cleaned.Count -gt 1 -and ("$($cleaned[0]) & $($cleaned[1])".Length -le 80)) {
                  $customTitle = "$($cleaned[0]) & $($cleaned[1])"
                } else {
                  $customTitle = $cleaned[0]
                }
              } elseif ($fixCommits.Count -gt 0) {
                $cleaned = @($fixCommits | ForEach-Object {
                  if ($_ -match '^(?:fix|bug)(?:\(.*\))?:\s*(.+)$') {
                    $t = $matches[1].Trim()
                    if ($t.Length -gt 1) { $t.Substring(0,1).ToUpper() + $t.Substring(1) } else { $t }
                  }
                })
                if ($cleaned.Count -gt 1 -and ("$($cleaned[0]) & $($cleaned[1])".Length -le 80)) {
                  $customTitle = "$($cleaned[0]) & $($cleaned[1])"
                } else {
                  $customTitle = $cleaned[0]
                }
              } else {
                $other = @($commits | Where-Object {
                  $_ -notmatch '^(Merge |chore|ci|refactor\(deps\)|bump)' -and $_.Trim() -ne ''
                })
                if ($other.Count -gt 0) {
                  $customTitle = $other[0].Trim()
                }
              }
            } catch {
              Write-Host "Could not parse commits for release title."
            }
          }

          # 4. Construct final title: e.g. "v2.2.3 - Feature Title"
          if ($customTitle -match '^Merge ') {
            $customTitle = ""
          }

          if ($customTitle) {
            if ($customTitle -match "^$([regex]::Escape($tag))\s*[-:]?\s*(.*)$") {
              $sub = $matches[1].Trim()
              if ($sub) {
                $finalTitle = "$tag - $sub"
              } else {
                $finalTitle = $tag
              }
            } else {
              $finalTitle = "$tag - $customTitle"
            }
          } else {
            $finalTitle = $tag
          }

          Write-Host "Resolved Tag: $tag"
          Write-Host "Resolved Title: $finalTitle"

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "title=$finalTitle" >> $env:GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Custom Release Notes
        shell: pwsh
        run: |
          $tag = "${{ steps.release-meta.outputs.tag }}"
          $title = "${{ steps.release-meta.outputs.title }}"
          ./scripts/generate-release-notes.ps1 -Tag $tag -Title $title

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        with:
          tag_name: ${{ steps.release-meta.outputs.tag }}
          name: ${{ steps.release-meta.outputs.title }}
          body_path: dist/RELEASE_NOTES.md
          append_body: true
          files: |
            dist/SubtitleSync-Setup.exe
            dist/SubtitleSync-Portable.exe
            dist/latest.yml
            dist/SubtitleSync-Setup.exe.blockmap
            dist/SHA256SUMS.txt
          generate_release_notes: ${{ github.event_name != 'release' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure Release Title
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        shell: pwsh
        run: |
          $tag = "${{ steps.release-meta.outputs.tag }}"
          $title = "${{ steps.release-meta.outputs.title }}"
          if ($tag -and $title) {
            gh release edit $tag --title $title
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts (CI Run)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SubtitleSync-Windows-Build
          path: |
            dist/SubtitleSync-Setup.exe
            dist/SubtitleSync-Portable.exe
            dist/latest.yml
            dist/SubtitleSync-Setup.exe.blockmap
            dist/SHA256SUMS.txt
          if-no-files-found: warn
