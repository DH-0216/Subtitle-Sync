# Configuration for GitHub's auto-generated release notes
# See: https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot[bot]
  categories:
    - title: "🚀 What's New"
      labels:
        - feature
        - enhancement
    - title: "🐛 Bug Fixes"
      labels:
        - bug
        - fix
    - title: "⚡ Performance & Improvements"
      labels:
        - performance
        - refactor
    - title: "📝 Documentation"
      labels:
        - documentation
        - docs
    - title: "🧰 Maintenance & Tooling"
      labels:
        - maintenance
        - dependencies
        - build
        - chore
    - title: "💬 Other Changes"
      labels:
        - "*"
